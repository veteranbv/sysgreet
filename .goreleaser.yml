version: 2

project_name: sysgreet

before:
  hooks:
    # Fail rather than silently rewrite go.mod at release time.
    - go mod tidy -diff
    - go mod verify

builds:
  - id: sysgreet
    main: ./cmd/sysgreet
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    # Reproducible: the same tag builds byte-identical binaries.
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.CommitDate}}

archives:
  - id: binary
    ids: [sysgreet]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - configs/example.yaml
      - configs/example.toml

checksum:
  name_template: "checksums.txt"

dockers: []

dist: dist

release:
  github:
    owner: veteranbv
    name: sysgreet

changelog:
  use: git

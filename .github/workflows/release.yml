name: Release

on:
  push:
    tags:
      - 'v*'
  # Invoked by the Tag Release workflow at the freshly pushed tag; tags
  # created with the default GITHUB_TOKEN do not fire the push trigger.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser builds the changelog from history and needs the tags.
          fetch-depth: 0
      - name: Ensure release commit is tagged
        run: |
          if ! git describe --exact-match --tags HEAD >/dev/null 2>&1; then
            echo "::error::No tag at HEAD. Cut releases with the 'Tag Release' workflow; running 'Release' directly only works at a tag ref."
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Always the latest Go release, so binaries ship with current
          # standard-library security fixes.
          go-version: stable
      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test ./...
      - name: Validate go install path
        run: |
          go install ./cmd/sysgreet
          sysgreet --version
      - name: Release notes from CHANGELOG.md
        run: scripts/release-notes.sh "$(git describe --exact-match --tags HEAD)" > "$RUNNER_TEMP/release-notes.md"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
